```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Error Terminal</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #020303;
    color: #00ff66;
    font-family: Consolas, monospace;
    overflow: hidden;
}

#terminal {
    height: 100dvh;
    overflow-y: auto;
    padding: 22px 15px;
    font-size: clamp(12px, 2.2vw, 17px);
    line-height: 1.8;
    background: radial-gradient(#07170c, #020303);
    scrollbar-width: none;
}

#terminal::-webkit-scrollbar {
    display: none;
}

.line {
    overflow-wrap: anywhere;
    animation: appear .1s ease;
}

.green {
    color: #00ff66;
    text-shadow: 0 0 8px #00ff66;
}

.red {
    color: #ff1515;
    font-weight: bold;
    text-shadow: 0 0 10px red;
}

.yellow {
    color: #ffe600;
    text-shadow: 0 0 8px yellow;
}

@keyframes appear {
    from { opacity: 0; transform: translateX(-5px); }
    to { opacity: 1; transform: translateX(0); }
}

/* BIG WARNING SCREEN */

#warning {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    background: #030000;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
}

#warning.active {
    display: flex;
    animation: flash .18s infinite;
}

.warning-icon {
    font-size: clamp(130px, 30vw, 230px);
    color: red;
    text-shadow: 0 0 30px red, 0 0 70px red;
    animation: pulse .3s infinite alternate;
}

.warning-title {
    color: red;
    font-size: clamp(38px, 10vw, 85px);
    font-weight: 900;
    letter-spacing: 5px;
    text-shadow: 0 0 25px red;
}

.warning-sub {
    color: #ff5555;
    font-size: clamp(13px, 3vw, 22px);
    margin-top: 20px;
    letter-spacing: 3px;
}

@keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.13); }
}

@keyframes flash {
    50% { background: #260000; }
}

/* SCREEN SHAKE */

.shake {
    animation: shake .1s infinite;
}

@keyframes shake {
    0% { transform: translate(0,0); }
    25% { transform: translate(-5px,3px); }
    50% { transform: translate(5px,-3px); }
    75% { transform: translate(-3px,-2px); }
    100% { transform: translate(0,0); }
}

/* CONTROLS */

.controls {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 200;
    display: flex;
    gap: 8px;
}

button {
    background: #07170c;
    color: #00ff66;
    border: 1px solid #00ff66;
    padding: 9px 13px;
    font-family: inherit;
    cursor: pointer;
}

button:hover {
    background: #00ff66;
    color: black;
}

#start {
    position: fixed;
    inset: 0;
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #020303;
}

#start button {
    font-size: 20px;
    padding: 17px 30px;
    border: 2px solid #00ff66;
    box-shadow: 0 0 20px #00ff66;
}

</style>
</head>

<body>

<div id="start">
    <button onclick="startAnimation()">
        ▶ START SYSTEM
    </button>
</div>

<div class="controls">
    <button onclick="restart()">RESTART</button>
    <button onclick="fullscreen()">FULLSCREEN</button>
</div>

<div id="terminal"></div>

<div id="warning">
    <div class="warning-icon">⚠</div>
    <div class="warning-title">WARNING</div>
    <div class="warning-sub">SYSTEM FAILURE DETECTED</div>
    <div class="warning-sub">CRITICAL SECURITY ALERT</div>
</div>

<script>

const terminal = document.getElementById("terminal");
const warning = document.getElementById("warning");

let timer;
let running = false;
let greenIndex = 0;
let errorIndex = 0;

const greenLogs = [
"INITIALIZING SYSTEM...",
"[OK] Loading core components...",
"[OK] Connecting server...",
"[OK] Database connection established",
"[OK] Authentication successful",
"[OK] Security protocols activated",
"[OK] Loading runtime modules...",
"[OK] API response received",
"[OK] Checking system integrity...",
"[OK] All components operational",
"[OK] Main process initialized",
"[OK] System running normally",
"[OK] Synchronization completed",
"[OK] Network connection stable"
];

const redLogs = [
"‼ CRITICAL ERROR :: SYSTEM FAILURE DETECTED",
"🚫 SECURITY ALERT :: INVALID CONFIGURATION",
"⚠ WARNING :: UNEXPECTED RESPONSE RECEIVED",
"‼ FATAL ERROR :: RUNTIME EXCEPTION",
"🚫 DATABASE CONNECTION LOST",
"⚠ ERROR CODE :: 0x8004F21",
"‼ CRITICAL FAILURE :: MODULE NOT RESPONDING",
"🚫 SYSTEM INTEGRITY COMPROMISED",
"⚠ MEMORY ALLOCATION ERROR",
"‼ RECOVERY PROCESS FAILED",
"🚫 CORE SERVICE UNAVAILABLE",
"⚠ MULTIPLE ERRORS DETECTED",
"‼ PROCESS TERMINATED UNEXPECTEDLY",
"🚫 SYSTEM SHUTDOWN INITIATED",
"‼‼‼ FATAL SYSTEM ERROR ‼‼‼"
];

function addLine(message, type) {
    const line = document.createElement("div");
    line.className = "line " + type;
    line.textContent =
        "[" + new Date().toLocaleTimeString() + "] " + message;

    terminal.appendChild(line);

    // Prevent unlimited DOM growth
    while (terminal.children.length > 150) {
        terminal.removeChild(terminal.firstChild);
    }

    terminal.scrollTop = terminal.scrollHeight;
}

function startAnimation() {
    clearTimeout(timer);
    running = true;
    greenIndex = 0;
    errorIndex = 0;

    terminal.innerHTML = "";
    terminal.style.background =
        "radial-gradient(#07170c, #020303)";

    warning.classList.remove("active");
    document.body.classList.remove("shake");

    document.getElementById("start").style.display = "none";

    greenMode();
}

function greenMode() {
    if (!running) return;

    if (greenIndex < greenLogs.length) {
        addLine(greenLogs[greenIndex], "green");
        greenIndex++;

        timer = setTimeout(greenMode, 55);
    } else {
        timer = setTimeout(showWarning, 700);
    }
}

function showWarning() {
    if (!running) return;

    terminal.innerHTML = "";
    warning.classList.add("active");

    document.body.classList.add("shake");

    if (navigator.vibrate) {
        navigator.vibrate([300, 100, 400, 100, 600]);
    }

    setTimeout(() => {
        if (!running) return;

        warning.classList.remove("active");
        document.body.classList.remove("shake");

        terminal.style.background =
            "radial-gradient(#200000, #020000)";

        errorMode();
    }, 2300);
}

function errorMode() {
    if (!running) return;

    const message = redLogs[
        errorIndex % redLogs.length
    ];

    addLine(message, errorIndex % 3 === 0 ? "red" : "yellow");

    errorIndex++;

    // Occasional screen shake
    if (errorIndex % 5 === 0) {
        document.body.classList.add("shake");

        setTimeout(() => {
            document.body.classList.remove("shake");
        }, 250);

        if (navigator.vibrate) {
            navigator.vibrate(100);
        }
    }

    timer = setTimeout(errorMode, 100);
}

function restart() {
    startAnimation();
}

function fullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.();
    } else {
        document.exitFullscreen?.();
    }
}

</script>

</body>
</html>
